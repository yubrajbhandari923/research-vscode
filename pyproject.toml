[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-panel"
version = "0.1.0"
description = "Project-local research memory: questions → experiments → runs → findings → decisions → checkpoints. Core + CLI for the Research Panel VS Code extension."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []  # stdlib only; PyYAML is vendored (used only if not installed)
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
research = "research_cli.main:main"

[tool.setuptools.packages.find]
where = ["packages/core", "packages/cli"]
include = ["research*", "research_cli*"]

[tool.setuptools.package-data]
research = ["templates/**/*", "templates/*", "_vendor/yaml/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
