[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-panel"
version = "3.5.2"
description = "ResearchOS: a CLI, terminal UI and supervisor for autonomous research with coding agents (Claude Code, Codex, Antigravity, opencode): plans, experiments, approvals, results."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []  # stdlib only; PyYAML is vendored (used only if not installed)
keywords = ["research", "experiments", "reproducibility", "agents", "claude-code", "codex", "opencode", "supervisor", "tui", "cli", "slurm", "hpc"]
authors = [{ name = "yubrajbhandari923" }]   # public metadata: no email on purpose
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/yubrajbhandari923/research-vscode"
Documentation = "https://github.com/yubrajbhandari923/research-vscode/blob/main/docs/QUICKSTART.md"
Repository = "https://github.com/yubrajbhandari923/research-vscode"
Issues = "https://github.com/yubrajbhandari923/research-vscode/issues"
Changelog = "https://github.com/yubrajbhandari923/research-vscode/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3"]
tui = ["textual>=0.80; python_full_version >= '3.8.1'"]
discord = ["discord.py>=2.4,<3; python_version >= '3.10'"]  # aiohttp needs 3.10; chat setup prints the install line

[project.scripts]
research = "research_cli.main:main"

[tool.setuptools.packages.find]
where = ["packages/core", "packages/cli"]
include = ["research*", "research_cli*"]

[tool.setuptools.package-data]
research = ["templates/**/*", "templates/*", "_vendor/yaml/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Default = fast inner loop (parallel, no slow/daemon tests). Full run: `-m "slow or not slow or daemon"`;
# daemon tests run serially: `-n 0 -m daemon`. Markers are assigned in tests/python/conftest.py.
addopts = '-m "not slow and not daemon" -n auto'
markers = [
    "slow: end-to-end scenarios or tests over ~2 s (bundles, whole workflows, real Quarto builds)",
    "daemon: starts a supervisor or gateway process (run serially, -n 0)",
    "pty: needs /dev/tty",
    "ext: needs node",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-xdist>=3",
]
