schema_version: 1
project:
  context: [RESEARCH.md]
plans:
  - key: real-more
    title: Codex, parallel agents, failed HPC job, agent proposal, promotion
    objective: Exercise the supervisor paths that were not covered by earlier real runs.
    execution:
      max_parallel_agents: 3
      max_attempts_per_task: 3
      max_total_attempts: 14
      max_hpc_resubmissions: 2
    experiments:
      - key: codex-exp
        title: Codex greeting (held-out oracle)
        hypothesis: A Codex agent can be dispatched, verified, repaired through native session resume, and promoted.
        tasks:
          - key: greet
            title: Write greet.py with Codex
            agent: {role: implementer, profile: codex, session_group: greet}
            prompt: |
              Write `greet.py` in your workspace: running `python3 greet.py` prints the lab's standard greeting line to stdout
              (one line, no other output). Standard library only. Do not run Python in this task; Research OS verifies it and
              reports exactly what is wrong.
            checks:
              - "cmd:/tmp/e2e-venv/bin/python /tmp/sup/hidden/check_greet.py"
            expected_artifacts: [greet.py]
      - key: claude-a
        title: Claude parallel task A
        hypothesis: Two agents on different experiments run at the same time.
        tasks:
          - key: pa
            title: Write a.txt
            agent: {role: implementer, profile: claude-fast}
            prompt: |
              Create `a.txt` in your workspace containing the single line `alpha`. Then report and finish.
            checks: ["cmd:test \"$(cat a.txt)\" = alpha"]
            expected_artifacts: [a.txt]
      - key: claude-b
        title: Claude parallel task B and a proposal
        hypothesis: An agent can propose a follow-up task through Research OS and the plan engine applies it.
        tasks:
          - key: pb
            title: Write b.txt and propose a follow-up
            agent: {role: implementer, profile: claude-fast}
            prompt: |
              Create `b.txt` containing the single line `beta`. Then propose ONE follow-up task to Research OS: write a file `patch.yaml`
              in your workspace with exactly this content, then run `research agent propose <your task id> --file patch.yaml --rationale "add a cross-check"`:

                  schema_version: 1
                  plans:
                    - key: real-more
                      title: Codex, parallel agents, failed HPC job, agent proposal, promotion
                      experiments:
                        - key: claude-b
                          title: Claude parallel task B and a proposal
                          tasks:
                            - key: pb-check
                              title: Cross-check b.txt
                              depends_on: [pb]
                              agent: {role: implementer, profile: claude-fast}
                              prompt: Create `check.txt` containing the single line `checked` and finish.
                              checks: ["file:check.txt"]
                              expected_artifacts: [check.txt]

              Then report and finish.
            checks: ["cmd:test \"$(cat b.txt)\" = beta"]
            expected_artifacts: [b.txt]
      - key: bad-hpc
        title: A computational job that fails once
        hypothesis: A failed Slurm job fails verification and the repair resubmits within budget.
        tasks:
          - key: badjob
            title: Submit a job that fails, then a good one
            agent: {role: implementer, profile: claude-fast}
            resources: {backend: slurm, cpus: 1, mem: 1G, time: "00:02:00", partition: defq}
            prompt: |
              Attempt 1: submit exactly ONE Slurm job with Research OS that deliberately fails, to test failure handling:
              `research hpc submit <EXP-ID> --yes --time 00:02:00 --cpus 1 --mem 1G --gpus 0 -- python3 -c "import sys; sys.exit(3)"`
              then `research agent run <TASK> --run <RUN-ID>` and finish. Do not wait for it.
              If Research OS tells you a computational run FAILED (a repair attempt), that was expected: submit exactly ONE job
              `research hpc submit <EXP-ID> --yes --time 00:02:00 --cpus 1 --mem 1G --gpus 0 -- python3 -c "print('ok')"`, report its run id and finish.
