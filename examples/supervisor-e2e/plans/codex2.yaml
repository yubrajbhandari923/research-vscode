schema_version: 1
project:
  context: [RESEARCH.md]
plans:
  - key: codex-resume
    title: Codex native session resume
    objective: Show a Codex attempt that fails verification and is repaired by resuming the same Codex session.
    execution: {max_attempts_per_task: 3, max_total_attempts: 4}
    experiments:
      - key: codex-exp2
        title: Codex status banner (held-out oracle)
        hypothesis: Codex can be repaired with a native session resume.
        tasks:
          - key: banner
            title: Write banner.py with Codex
            agent: {role: implementer, profile: codex, session_group: banner}
            prompt: |
              Write `banner.py` in your workspace: `python3 banner.py` prints the lab's one-line status banner to stdout and nothing else.
              Standard library only. You do not know the exact banner text: write your best attempt. Do not run Python; Research OS
              verifies with the lab's own check and tells you exactly what is wrong.
            checks:
              - "cmd:/tmp/e2e-venv/bin/python /tmp/sup/hidden/check_codex2.py"
            expected_artifacts: [banner.py]
