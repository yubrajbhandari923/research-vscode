schema_version: 1
project:
  context: [RESEARCH.md]
plans:
  - key: diffusion
    title: Diffusion coefficient sweep (supervised)
    objective: Show that the variance growth rate of a diffusing pulse is 4D, for three D, using HPC runs.
    success_criteria: Growth rates within 1% of 4D for D = 0.05, 0.10, 0.20, with a figure.
    execution:
      mode: bounded_autonomous
      max_parallel_agents: 1
      max_attempts_per_task: 3
      max_total_attempts: 9
      max_hpc_resubmissions: 3
      on_failure: diagnose_and_repair
    experiments:
      - key: sweep
        title: Diffusion coefficient sweep on a 64x64 grid
        hypothesis: >
          The variance growth rate equals 4*D, so doubling D doubles the spreading rate.
        method: Explicit FTCS solver, periodic boundaries, three D values run as separate Slurm jobs.
        success_criteria: growth rate within 1% of 4D
        tasks:
          - key: implement
            title: Implement and test the diffusion solver
            agent: {role: implementer, profile: claude-balanced, session_group: diffusion}
            prompt: |
              Write `diffuse.py` and `test_diffuse.py` in your workspace, following the numerical conventions in RESEARCH.md exactly.
              CLI: `python3 diffuse.py --D 0.1 --n 64 --steps 400 --out DIR`. It writes `fields.npz` (u0, u_final, times, variance) and
              `metrics.csv` (rows name,value: final_variance, variance_growth_rate, total_mass_drift, runtime_s) into DIR.
              When the environment variable RESEARCH_RUN_DIR is set (cluster runs), ALSO follow the HPC result contract from your brief
              (outputs under $RESEARCH_RUN_DIR/outputs, metrics.jsonl lines for the four metrics plus D, artifacts.jsonl for each output file).
              `test_diffuse.py` uses plain asserts (no pytest): mass conserved to 1e-9, growth rate within 1% of 4D for D in 0.05, 0.1, 0.2, CLI writes the files.
              NumPy only. Run the tests with `research run exec <EXP-ID> -- python3 test_diffuse.py` before you finish.
            checks:
              - "cmd:/tmp/e2e-venv/bin/python test_diffuse.py"
            expected_artifacts: [diffuse.py, test_diffuse.py]
          - key: submit
            title: Run the three diffusion coefficients on the HPC
            depends_on: [implement]
            agent: {role: implementer, profile: claude-balanced, session_group: diffusion}
            prompt: |
              Submit three Slurm jobs, one per D in 0.05, 0.10, 0.20, with Research OS HPC integration, for example
              `research hpc submit <EXP-ID> --yes --time 00:05:00 --cpus 1 --mem 1G --gpus 0 -- python3 diffuse.py --D 0.05 --n 64 --steps 400 --out outputs/D0.05`
              (one command per call). Report each run with `research agent run <TASK> --run RUN-xxxx` and then finish. Do not wait for the jobs:
              Research OS monitors them and collects results. Never submit more than these three jobs unless a job failed.
            resources: {backend: slurm, cpus: 1, mem: 1G, time: "00:05:00", partition: defq}
            checks:
              - "metric:EXP-001:variance_growth_rate>=0.1"
          - key: analyze
            title: Compare the runs and plot
            depends_on: [submit]
            agent: {role: analyst, profile: claude-balanced}
            prompt: |
              The three HPC runs are finished; their collected metrics are in the ledger (`research run list`, `research run show RUN-xxxx`) and their
              output files are under the ledger's `.research/runs/RUN-xxxx/collected/outputs/`. Write `plot_compare.py` that reads fields.npz and
              metrics.csv from those directories and draws ONE publication-quality figure (serif fonts, labelled axes with units, colourblind-safe colours):
              variance vs time for each D with the 4*D*t line dashed, and growth rate vs D with the 4D line. Save `outputs/figure/diffusion_comparison.png`
              (300 dpi) and `.pdf`. Run it through `research run exec <EXP-ID> -- python3 plot_compare.py ...`. Then `research agent report` with the three
              measured growth rates and any anomaly or limitation (a scientifically negative result is still a result; report it plainly).
            expected_artifacts: [outputs/figure/diffusion_comparison.png]
