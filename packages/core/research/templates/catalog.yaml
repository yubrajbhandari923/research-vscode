# Research OS skills catalog. Generated at release time from the first-party skills, the vendored copies in catalog/ and the pinned upstream commits.
# kind: first-party (ships in skills/) · bundled (a curated, attributed copy in catalog/, works offline) · external (installed from its source at the pinned commit on request).
version: 1
skills:
- name: clean-dataset
  kind: first-party
  description: Treat data cleaning/conversion as an experiment with validation evidence rather than an untracked script run.
  license: MIT
  author: Research OS
  path: skills/clean-dataset
  applies_to:
  - data
  packs:
  - core-research
- name: engineering-loop
  kind: first-party
  description: Specification → tests → implementation loop across Opus/Sonnet/Haiku tiers with bounded retries. Use for any engineering task;
    skip tiers that the task does not need.
  license: MIT
  author: Research OS
  path: skills/engineering-loop
  applies_to:
  - implementation
  - debug
  - implementer
  packs:
  - core-research
- name: failure-triage
  kind: first-party
  description: 'Diagnose a failed or suspicious run, test or experiment systematically: classify the failure, reproduce it, isolate the cause
    with evidence, fix the cause once, and record what was learned. Use when a run fails, a metric is NaN or implausible, a test flakes, results
    contradict the hypothesis, or a task check fails twice.'
  license: MIT
  author: Research OS
  path: skills/failure-triage
  applies_to:
  - debug
  packs:
  - core-research
- name: hpc-setup
  kind: first-party
  description: Configure, diagnose and repair remote HPC execution (SSH + Slurm). Use when `research hpc` reports a problem, when a project needs
    remote execution for the first time, or when the user asks why remote submission is not working.
  license: MIT
  author: Research OS
  path: skills/hpc-setup
  applies_to:
  - hpc
  packs:
  - core-research
  - hpc
- name: hypothesis-design
  kind: first-party
  description: Turn an idea into a falsifiable hypothesis with a prediction, controls, baselines, a primary metric, success and failure criteria
    and the confounds that could fool you, before any run exists. Use when creating or revising an experiment, when a hypothesis is vague ("improves",
    "better"), or when results arrive and nobody wrote down what would count as failure.
  license: MIT
  author: Research OS
  path: skills/hypothesis-design
  applies_to:
  - planner
  - research
  packs:
  - core-research
- name: independent-review
  kind: first-party
  description: 'Review another agent''s or person''s work as an independent verifier: check methodology, evidence, numbers, controls and conclusions
    against the records, and give a verdict (supported, needs work, contradicted) with reasons. Use when dispatched as verifier, when asked to
    review a finding, experiment, task result or guide chapter, or before accepting your own surprising result.'
  license: MIT
  author: Research OS
  path: skills/independent-review
  applies_to:
  - verifier
  - verification
  packs:
  - core-research
- name: literature-evidence
  kind: first-party
  description: 'Verify citations and establish what the literature supports: confirm each source exists and says what is claimed, compare papers
    on equal terms, check novelty and prior art, and record sources with separate identity, examination and support. Use when citing a paper,
    writing related work or a guide chapter, judging whether an idea is new, or checking a reference list.'
  license: MIT
  author: Research OS
  path: skills/literature-evidence
  applies_to:
  - research
  packs:
  - core-research
- name: parameter-tuning
  kind: first-party
  description: Bounded, validation-only parameter tuning with a frozen selection criterion and a one-shot held-out test. Use when automating a
    parameter search.
